[package]
name = "editor-backend"
version = "1.0.0"
edition = "2021"
description = "The editor surface's own programs: a JSON-RPC backend and a CLI over one method table, no network, no Tauri."

[workspace]

[dependencies]
base64 = "0.23.1"
ignore = "0.4.33"
regex = "1.13.1"
serde_json = "1.0"
taplo = { version = "0.14", default-features = false }

[profile.release]
strip = true
